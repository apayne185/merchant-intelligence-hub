[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

# =============================================================================
# Merchant Intelligence Hub
# =============================================================================
# Estructura de packaging moderna (PEP 621 + Hatch).
#
# Install (recomendado, con uv — https://docs.astral.sh/uv/):
#     uv sync --extra dev          # resuelve + crea .venv + genera uv.lock
#
# Install (fallback con pip):
#     pip install -e ".[dev]"
#
# Run the Merchant Intelligence Copilot:
#     MOCK_LLM=1 uv run uvicorn src.copilot.api:app --reload --port 8001
#
# Run the complaint-classification API (Parte 4):
#     MOCK_LLM=1 uv run uvicorn src.parte4_api.main:app --reload --port 8000
#
# Test:
#     MOCK_LLM=1 uv run pytest -v
#
# Nuevas dependencias: version fijada + justificacion en DECISIONS.md.
# =============================================================================

[project]
name = "merchant-intelligence-hub"
version = "0.3.0"
description = "Merchant Intelligence Copilot — a multi-agent system (LangGraph + Agno) answering natural-language merchant questions via real KPI/SQL tools, a churn-risk model, and policy RAG, with cited answers — built on a pandas/PySpark ETL and churn-risk ML pipeline underneath."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Anna Payne" },
]
keywords = ["ai-agents", "langgraph", "rag", "llm", "data-engineering", "machine-learning", "fastapi"]

# -----------------------------------------------------------------------------
# Core deps — necesarias para que la app y los tests arranquen
# -----------------------------------------------------------------------------
dependencies = [
    # Data & ML
    "pandas==2.2.3",
    # numpy 1.26.4 has no Python 3.13 wheel (last 1.26.x release, predates
    # 3.13's Oct-2024 launch) — uv falls back to a from-source build, which
    # is what made CI hang for 2+ hours instead of the ~1min local install.
    # 2.1.3 is the earliest 2.x with cp313 wheels (verified via PyPI's file
    # list), chosen to minimize behavioral distance from 1.26.4 rather than
    # jumping to the newest 2.x. See DECISIONS.md D31 (same wheel-
    # availability issue D13 already hit and fixed for pandas).
    "numpy==2.1.3",
    # 1.5.1 also has no cp313 wheel; 1.5.2 (patch release, same reason as
    # numpy above) does. See DECISIONS.md D31.
    "scikit-learn==1.5.2",
    "xgboost==2.1.1",
    "lightgbm==4.5.0",
    "shap==0.46.0",

    # Notebook (Parte 3)
    "jupyter==1.0.0",
    "ipykernel==7.3.0",

    # API stack (Parte 4) — uvicorn obligatorio
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",

    # Agentic framework (Parte 4) — OBLIGATORIO, no sustituir por LangChain/LlamaIndex
    "agno>=2.5,<3",
    "openai>=1.40,<2",

    # Copilot orchestrator (src/copilot/) — LangGraph owns graph/state/control-flow
    # only; LLM calls inside nodes still go through Agno (see DECISIONS.md D22) so
    # there's exactly one agent-framework pattern in the repo, not two competing
    # ones. No langchain-openai/chat-model dep needed as a result.
    "langgraph>=1.2,<2",
    # Real SQL execution for the Data Analyst tool (src/copilot/tools/data_analyst.py)
    # over a pandas df — see DECISIONS.md D23 for why (parameterized queries, not
    # LLM-generated SQL).
    "duckdb>=1.5,<2",

    # Utilidades comunes
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
# Dependencias de desarrollo y tests
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
    "ruff==0.6.9",
    # Runs .pre-commit-config.yaml locally (D29) — CI enforces the eval gate
    # independently via ci.yml, this is for local hygiene before pushing.
    "pre-commit==4.0.1",
]

# Opcional para la Parte 5 bonus (collusion rings)
bonus = [
    "networkx==3.3",
]
pyspark = [
    "delta-spark==3.2.1",
    "pyspark==3.5.3",
]

[project.urls]
Homepage = "https://github.com/apayne185/merchant-intelligence-hub"

# -----------------------------------------------------------------------------
# Hatch — qué empaquetar
# -----------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

# -----------------------------------------------------------------------------
# uv — configuración mínima del gestor (https://docs.astral.sh/uv/)
# -----------------------------------------------------------------------------
[tool.uv]
# Garantiza venv local y resolución determinista (uv.lock se commitea).
managed = true

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
pythonpath = ["."]

# -----------------------------------------------------------------------------
# Ruff (lint opcional)
# -----------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "RUF",           # ruff-specific
]
ignore = [
    "E501",  # line too long (gestionado por formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "RUF"]
