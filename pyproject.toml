[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

# Filings & Risk Copilot
#
#   uv sync --extra dev          # also compiles the C++ engine (cpp/riskcore)
#   MOCK_LLM=1 uv run uvicorn src.copilot.api:app --port 8001
#   MOCK_LLM=1 uv run pytest
#
# Every pinned dependency is justified in DECISIONS.md.

[project]
name = "filings-risk-copilot"
version = "1.0.0"
description = "Multi-agent copilot over SEC filings and market risk: point-in-time XBRL facts, a C++20 VaR engine, streaming EDGAR ingestion, and answers whose every number is verified against its source filing."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Anna Payne" }]
keywords = ["llm", "agents", "langgraph", "rag", "sec-edgar", "xbrl", "value-at-risk", "pybind11", "fastapi"]

dependencies = [
    # C++20 VaR/ES engine (workspace member, built by scikit-build-core).
    "riskcore",

    # Data
    "pandas==2.3.3",
    "numpy==2.2.6",
    # Point-in-time fact store.
    "duckdb>=1.5,<2",
    # EDGAR client.
    "httpx==0.28.1",

    # API
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",

    # Agents: LangGraph owns control flow and state; LLM calls inside nodes go
    # through Agno, so there is one agent-framework pattern, not two.
    "langgraph>=1.2,<2",
    "agno>=2.5,<4",
    "openai>=1.40,<4",

    # Observability: OTel API/SDK/exporter move in lockstep.
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "prometheus-client==0.26.0",
    "prometheus-fastapi-instrumentator==8.1.0",

    # Platform: JWT auth, Redis (rate limits, cache, event streams), Postgres audit log.
    "pyjwt[crypto]==2.15.1",
    "redis==8.1.0",
    "psycopg[binary,pool]==3.3.6",

    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.16.9",
    "pre-commit==4.6.2",
    "pytest-cov==7.1.0",
    "mypy==2.3.1",
    "bandit==1.9.4",
    "fakeredis==2.32.0",
    "pandas-stubs==2.3.3.260113",
]

[project.urls]
Homepage = "https://github.com/apayne185/merchant-intelligence-hub"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
managed = true

[tool.uv.workspace]
members = ["cpp/riskcore"]

[tool.uv.sources]
riskcore = { workspace = true }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: needs real Redis/Postgres (REDIS_URL / AUDIT_DATABASE_URL); skipped otherwise",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.10"
files = ["src"]
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

# The --strict flag set, spelled out: `strict = true` inside an override leaks
# its global-only flags to every module in the run.
[[tool.mypy.overrides]]
module = ["src.copilot.infra.*", "src.filings.*", "src.risk.*", "src.streaming.*", "src.marketdata.*", "src.copilot.verification"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]
extend-exclude = ["cpp/riskcore/build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "RUF"]
