# Pre-commit hooks.
#
#   uv run pre-commit install           # once
#   uv run pre-commit run --all-files   # everything
#
# ruff is pinned to the same version as the dev dependency in pyproject.toml,
# so local results match `make lint` and CI.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]

  # Secret scanning: a single static binary, no Python dependency.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # House style: no em dashes anywhere (also enforced in CI).
  - repo: local
    hooks:
      - id: no-em-dash
        name: no em dashes
        entry: python3 scripts/check_no_em_dash.py
        language: system
        pass_filenames: false
