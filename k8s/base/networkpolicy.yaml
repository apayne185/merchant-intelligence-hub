# Default-deny for the copilot pods, then allow exactly what they need.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: merchant-copilot
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:  # ingress controller
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports: [{ port: 8001, protocol: TCP }]
    - from:  # Prometheus scrapes /metrics
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports: [{ port: 8001, protocol: TCP }]
  egress:
    - to:  # DNS
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:  # OTel collector
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports: [{ port: 4318, protocol: TCP }]
    # Managed Redis/Postgres and the LLM/IdP endpoints live outside the
    # cluster: allow their ports to non-cluster addresses only. Tighten to
    # the VPC CIDR / provider IP ranges per environment.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [10.0.0.0/8]
      ports:
        - { port: 443, protocol: TCP }   # OpenAI API, IdP JWKS
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - { port: 6379, protocol: TCP }  # Redis
        - { port: 6380, protocol: TCP }  # Redis (TLS)
        - { port: 5432, protocol: TCP }  # Postgres
