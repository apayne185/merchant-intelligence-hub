# EDGAR ingestion: one poller publishing new filings to the edgar:filings
# stream, and N workers consuming it as a Redis consumer group. Workers are
# stateless competing consumers, so they scale horizontally; the poller is
# safe to run twice (publication is deduplicated with an atomic SADD) but one
# is enough. Both use the API image with a different command.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filings-ingest-worker
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/component: ingest-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ingest-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: filings-copilot
      automountServiceAccountToken: false
      # In-flight messages of a killed worker are reclaimed by its peers
      # (XAUTOCLAIM), so a short grace period loses nothing.
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: filings-copilot
          command: ["python", "-m", "src.streaming.worker", "--source", "live", "--metrics-port", "9102"]
          ports: [{ name: metrics, containerPort: 9102, protocol: TCP }]
          env:
            - { name: LOG_FORMAT, value: json }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: filings-copilot, key: REDIS_URL } }
            - name: SEC_USER_AGENT
              valueFrom: { secretKeyRef: { name: filings-copilot, key: SEC_USER_AGENT } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            periodSeconds: 20
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 32Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filings-poller
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/component: poller
  template:
    metadata:
      labels:
        app.kubernetes.io/component: poller
    spec:
      serviceAccountName: filings-copilot
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: poller
          image: filings-copilot
          command: ["python", "-m", "src.streaming.poller", "--live", "--interval", "60"]
          env:
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: filings-copilot, key: REDIS_URL } }
            - name: SEC_USER_AGENT
              valueFrom: { secretKeyRef: { name: filings-copilot, key: SEC_USER_AGENT } }
          resources:
            requests: { cpu: 20m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
# Ingestion pods talk to Redis and sec.gov only; nothing calls into them
# except Prometheus.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: filings-ingest
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: [ingest-worker, poller] }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports: [{ port: 9102, protocol: TCP }]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [10.0.0.0/8]
      ports: [{ port: 443, protocol: TCP }]   # data.sec.gov, www.sec.gov
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - { port: 6379, protocol: TCP }
        - { port: 6380, protocol: TCP }
