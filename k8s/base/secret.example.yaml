# NOT applied by kustomization.yaml on purpose: real secret values never go
# in git. Create the Secret out of band, e.g.:
#
#   kubectl -n filings-risk create secret generic filings-copilot \
#     --from-literal=OPENAI_API_KEY=sk-... \
#     --from-literal=REDIS_URL=rediss://:password@redis.internal:6380/0 \
#     --from-literal=AUDIT_DATABASE_URL='postgresql://copilot:...@pg.internal:5432/copilot?sslmode=require' \
#     --from-literal=SEC_USER_AGENT='Your Firm research@yourfirm.com'
#
# or, better, sync it from a secret manager with External Secrets Operator /
# Secrets Store CSI driver (AWS Secrets Manager, Vault, Azure Key Vault).
# Redis/Postgres are expected to be managed services (ElastiCache, RDS/
# Cloud SQL) rather than StatefulSets in this namespace. Redis must run with
# persistence and a volatile-* eviction policy: it carries the filing streams.
apiVersion: v1
kind: Secret
metadata:
  name: filings-copilot
  namespace: filings-risk
type: Opaque
stringData:
  OPENAI_API_KEY: "replace-me"
  REDIS_URL: "rediss://:replace-me@redis.internal:6380/0"
  AUDIT_DATABASE_URL: "postgresql://copilot:replace-me@postgres.internal:5432/copilot?sslmode=require"
  SEC_USER_AGENT: "Your Firm research@yourfirm.com"
