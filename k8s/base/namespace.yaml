apiVersion: v1
kind: Namespace
metadata:
  name: filings-risk
  labels:
    # Pod Security Admission: reject any pod in this namespace that doesn't
    # meet the `restricted` profile (non-root, no privilege escalation,
    # all capabilities dropped, seccomp), the deployment is written to pass it.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
