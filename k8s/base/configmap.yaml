# Non-secret runtime config (src/copilot/infra/settings.py). Secrets —
# AUTH_JWT_SECRET/OPENAI_API_KEY/REDIS_URL/AUDIT_DATABASE_URL — live in the
# `merchant-copilot` Secret (secret.example.yaml), never here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: merchant-copilot-config
data:
  APP_ENV: production
  MOCK_LLM: "0"
  LOG_FORMAT: json
  LOG_LEVEL: INFO
  # Production uses an IdP: RS256 tokens verified against its JWKS
  # (settings.py refuses AUTH_MODE=none under APP_ENV=production).
  AUTH_MODE: jwt
  AUTH_JWKS_URL: https://idp.example.com/.well-known/jwks.json
  AUTH_JWT_AUDIENCE: merchant-copilot-api
  AUTH_JWT_ISSUER: https://idp.example.com/
  AUTH_REQUIRED_SCOPE: copilot:ask
  RATE_LIMIT_PER_MINUTE: "60"
  CACHE_TTL_SECONDS: "300"
  COPILOT_TRACE_EXPORTER: otlp
  # Cluster-level collector (e.g. deployed by the OpenTelemetry Operator),
  # running deploy/otel-collector/config.yaml's pipeline.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318
  OTEL_SERVICE_NAME: merchant-intelligence-copilot
  # Trust X-Forwarded-For only from the pod network the ingress controller
  # runs in (uvicorn --proxy-headers); adjust to your cluster's pod CIDR.
  FORWARDED_ALLOW_IPS: 10.0.0.0/8
