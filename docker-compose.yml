# Local production-like stack for the Filings & Risk Copilot.
#
#   docker compose up -d --build        # API, ingest workers, Redis, Postgres, observability
#   docker compose run --rm poller-replay    # publish the fixture filing index into the stream
#   SEC_USER_AGENT="Name you@example.com" docker compose --profile live up -d poller   # live EDGAR polling
#
#   TOKEN=$(make token)
#   curl -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
#        -d '{"question": "What was Apple revenue in FY2025?"}' localhost:8001/ask
#
# UIs: API docs http://localhost:8001/docs, Grafana http://localhost:3000 (anonymous viewer),
#      Prometheus http://localhost:9090, Jaeger http://localhost:16686
#
# Defaults to MOCK_LLM=1 (zero cost). For real LLM calls put OPENAI_API_KEY in
# a .env file next to this one and set MOCK_LLM=0. Secrets here are local-only
# placeholders; k8s/ reads real ones from a Secret.

name: filings-risk-copilot

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  copilot:
    <<: *hardening
    build:
      context: .
      args:
        VERSION: "1.0.0-compose"
    image: filings-risk-copilot:compose
    ports: ["8001:8001"]
    environment:
      MOCK_LLM: "${MOCK_LLM:-1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      APP_ENV: development
      AUTH_MODE: jwt
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:-local-dev-secret-change-me-0123456789}"
      RATE_LIMIT_PER_MINUTE: "60"
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: "300"
      AUDIT_DATABASE_URL: postgresql://copilot:copilot@postgres:5432/copilot
      COPILOT_TRACE_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: filings-risk-copilot
      OTEL_RESOURCE_ATTRIBUTES: service.version=1.0.0,deployment.environment=compose
      LOG_FORMAT: json
    # Same runtime constraints as the k8s securityContext, so "works in compose"
    # predicts "works in the cluster".
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    # scripts/ is mounted read-only so `make token` can mint a dev JWT with
    # the container's own secret.
    volumes: ["./scripts:/app/scripts:ro"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      otel-collector: { condition: service_started }

  # Competing consumers in the `ingest` group: scale with --scale ingest-worker=N.
  ingest-worker:
    <<: *hardening
    image: filings-risk-copilot:compose
    command: ["python", "-m", "src.streaming.worker", "--source", "${INGEST_SOURCE:-fixtures}"]
    environment:
      REDIS_URL: redis://redis:6379/0
      SEC_USER_AGENT: "${SEC_USER_AGENT:-}"
      LOG_FORMAT: json
    deploy: { replicas: 2 }
    # The image's default health check probes the API port; workers expose metrics instead.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9102/metrics', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    depends_on:
      redis: { condition: service_healthy }
      copilot: { condition: service_started }

  # One-shot (`docker compose run --rm poller-replay`): publishes
  # data/filings/filing_index.json as filing events.
  poller-replay:
    image: filings-risk-copilot:compose
    profiles: [replay]
    command: ["python", "-m", "src.streaming.poller", "--replay"]
    environment: { REDIS_URL: "redis://redis:6379/0" }
    read_only: true
    cap_drop: [ALL]
    depends_on: { redis: { condition: service_healthy } }

  poller:
    <<: *hardening
    image: filings-risk-copilot:compose
    profiles: [live]
    command: ["python", "-m", "src.streaming.poller", "--live", "--interval", "60"]
    environment:
      REDIS_URL: redis://redis:6379/0
      # Required for live polling; the poller exits with a clear error without it.
      SEC_USER_AGENT: "${SEC_USER_AGENT:-}"
    read_only: true
    cap_drop: [ALL]
    depends_on: { redis: { condition: service_healthy } }

  redis:
    <<: *hardening
    image: redis:8.10.2-alpine
    # Redis holds disposable keys (cache, rate-limit counters, all with TTLs)
    # and durable ones (the filing streams). volatile-lru evicts only keys with
    # a TTL, so memory pressure drops cache entries, never the work queue;
    # AOF persistence keeps the streams across restarts.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes: ["redisdata:/data"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  postgres:
    <<: *hardening
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    <<: *hardening
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./deploy/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter (spanmetrics)
      - "13133:13133" # health_check extension
    depends_on: [jaeger]

  jaeger:
    <<: *hardening
    image: jaegertracing/jaeger:2.21.0
    ports: ["16686:16686"]

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports: ["9090:9090"]

  grafana:
    <<: *hardening
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/copilot.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, jaeger]

volumes:
  pgdata:
  promdata:
  redisdata:
