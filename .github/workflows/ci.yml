name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        # Advisory, not a hard gate — matches `make lint`'s own `|| true`.
        # There's pre-existing lint debt (mostly unused imports in the
        # notebooks) not addressed by this change; fixing that is a
        # separate cleanup pass, not a reason to block CI on unrelated PRs.
        continue-on-error: true
        run: uv run ruff check src/ tests/

      - name: Test
        env:
          MOCK_LLM: "1"
        run: uv run pytest -v
