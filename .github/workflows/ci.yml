name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Lockfile freshness check
        # `uv sync` (below) silently reconciles pyproject.toml/uv.lock
        # drift on the fly without failing — which is exactly why this repo
        # accumulated real drift 4 times over via dependabot merges
        # (shap, pre-commit, pyspark, ruff all had a stale uv.lock even
        # though pyproject.toml was correctly bumped) before a `--frozen`
        # sync (in the Dockerfile) finally hit it as a hard build failure.
        # `uv lock --check` catches this immediately instead. See
        # DECISIONS.md D33.
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        # Advisory, not a hard gate — matches `make lint`'s own `|| true`.
        # There's pre-existing lint debt (mostly unused imports in the
        # notebooks) not addressed by this change; fixing that is a
        # separate cleanup pass, not a reason to block CI on unrelated PRs.
        continue-on-error: true
        run: uv run ruff check src/ tests/

      - name: Test
        env:
          MOCK_LLM: "1"
        run: uv run pytest -v

      - name: Eval — complaint classifier golden set
        env:
          MOCK_LLM: "1"
        run: uv run python -m scripts.evaluate_classifier

      - name: Eval — copilot golden set
        env:
          MOCK_LLM: "1"
        run: uv run python -m scripts.evaluate_copilot

      - name: Eval gate — hard reliability floors
        # Unlike Lint above, this is NOT advisory — it fails the build.
        # Floors are anchored to committed baseline values (DECISIONS.md
        # D21, D28); both harnesses are deterministic under MOCK_LLM=1, so
        # a failure here means a real regression, not noise. See D29.
        run: uv run python -m scripts.check_eval_floors
