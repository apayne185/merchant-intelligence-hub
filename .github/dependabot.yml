# Automated dependency updates — see DECISIONS.md D29.
version: 2
updates:
  # Covers pyproject.toml / uv.lock.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # outputs/model.pkl is a joblib pickle of a sklearn Pipeline created
      # under scikit-learn 1.5.x. Verified (DECISIONS.md D32): even a minor
      # bump (1.5.2 -> 1.7.2) hard-breaks unpickling it
      # (AttributeError: _RemainderColsList, an internal ColumnTransformer
      # class that changed between versions) — not just the harmless
      # InconsistentVersionWarning a patch bump produces (D31). Patches
      # still flow through; a minor/major bump needs a deliberate
      # re-train-and-re-pickle first, not an automated PR.
      - dependency-name: "scikit-learn"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # delta-spark's major version is tied to a specific PySpark major
      # version (delta-spark 4.x requires pyspark 4.x); this repo
      # intentionally pins pyspark==3.5.x. A coordinated Spark-4 migration
      # is a deliberate undertaking, not a routine dependency bump — and
      # dependabot proposes each package independently, so it can't do that
      # coordination itself.
      - dependency-name: "delta-spark"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pyspark"
        update-types: ["version-update:semver-major"]

  # Keeps actions/checkout, astral-sh/setup-uv, actions/setup-python
  # (.github/workflows/ci.yml) pinned to current, patched versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
