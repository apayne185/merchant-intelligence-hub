# Automated dependency updates.
version: 2
updates:
  # Covers pyproject.toml / uv.lock. Must be "uv", not "pip": the pip
  # ecosystem bumps pyproject.toml but never regenerates uv.lock, so its PRs
  # fail CI's `uv lock --check`.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keeps actions/checkout, astral-sh/setup-uv, actions/setup-python
  # (.github/workflows/ci.yml) pinned to current, patched versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Dockerfile base images (python slim, uv) are pinned tag@digest;
  # this is what moves those pins forward, including picking up base-image
  # CVE fixes the CI Trivy gate would otherwise start failing on.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The interpreter version is a runtime migration, not a routine bump:
      # pyproject.toml pins requires-python <3.14 and CI tests on 3.13, so a
      # 3.14 base image cannot even resolve an interpreter (PR #57 failed
      # exactly this way). Patch releases and digest refreshes still flow.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # docker-compose.yml service images (redis, postgres, collector,
  # prometheus, grafana, jaeger).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
