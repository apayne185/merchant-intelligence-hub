# Prometheus scrape config for docker-compose (D51). In k8s the same jobs
# would come from a ServiceMonitor / pod annotations instead — see
# k8s/base/deployment.yaml's prometheus.io/* annotations.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: copilot
    metrics_path: /metrics
    static_configs:
      - targets: ["copilot:8001"]

  - job_name: otel-collector-spanmetrics
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
