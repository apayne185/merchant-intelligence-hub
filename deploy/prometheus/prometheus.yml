# Prometheus scrape config for docker-compose. In k8s the same jobs come from
# pod annotations (prometheus.io/*) on the Deployments.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: copilot
    metrics_path: /metrics
    static_configs:
      - targets: ["copilot:8001"]

  # Every replica of the scaled ingest-worker service, via Docker's DNS.
  - job_name: ingest-worker
    dns_sd_configs:
      - names: ["ingest-worker"]
        type: A
        port: 9102

  - job_name: otel-collector-spanmetrics
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
